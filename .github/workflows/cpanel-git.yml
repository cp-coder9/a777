name: cPanel Git discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect is read-only; native-preflight runs the private CLI hook without live deployment
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - prepare-key
          - clone
          - native-preflight
          - restore-rehearsal
          - native-deploy
          - native-status
          - native-recover
      secure_runtime_config_permissions:
        description: Explicit permission-only repair of the owned runtime config
        type: boolean
        default: false
        required: false
      expected_runtime_config_sha256:
        description: Optional exact lowercase SHA256 from independently confirmed runtime receipt (read-only managed DB transport only)
        type: string
        required: false
      expected_key_fingerprint:
        description: SHA256 fingerprint required for clone and existing-key preparation reruns
        type: string
        required: false
      allow_existing_public_source_for_rehearsal:
        description: Read only existing pinned public source for private encrypted recovery; never deployment authority
        type: boolean
        default: false
        required: false
      retry_safe_native_deploy:
        description: Explicit new-commit retry after trusted terminal pre-DDL failure only
        type: boolean
        default: false
        required: false
      retry_initial_rehearsal:
        description: Explicit retry only after verified failure before recovery or target creation
        type: boolean
        default: false
        required: false

concurrency:
  group: a777-cpanel-git
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, zip, mbstring
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test discovery contracts without hosting credentials
        run: python -m unittest discover -s tools/tests -p 'test_cpanel_git*.py'
      - name: Linux permission-only fixture (synthetic, no hosting credentials)
        run: |
          php -l tools/cpanel_git_deploy.php
          php tools/tests/cpanel_runtime_permissions_linux.php
          python -m unittest discover -s tools/tests -p 'test_cpanel_runtime_permissions.py'
      - name: Source-storage POSIX fixture (synthetic, no hosting credentials)
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          php tools/tests/CpanelRestoreRehearsal_test.php
          php tools/tests/CpanelRestoreRehearsal_local_backup.php
          php tools/tests/CpanelRestoreRehearsal_source_permissions.php
      - name: Native activation file-fault fixtures (no hosting credentials)
        env:
          A777_NATIVE_FIXTURE_ROOT: ${{ runner.temp }}/a777-native-fixtures
        run: |
          install -d -m 0700 "$A777_NATIVE_FIXTURE_ROOT"
          php tools/tests/CpanelNativeDeployment_test.php
          php tools/tests/CpanelNativeReceipt_test.php
          php tools/tests/CpanelNativeDiagnostics_test.php
          php tools/tests/CpanelPdoPermissionDenial_test.php
          php tools/tests/CpanelNativeSchemaCapabilities_test.php
          php tools/tests/CpanelMaintenanceApi_test.php
          php tools/tests/CpanelNativeDeployment_files_native.php
          php tools/tests/CpanelNativeRecovery_test.php
          TMPDIR="$RUNNER_TEMP" php tools/tests/CpanelNativeRecovery_nativeFilesystem_test.php
          sudo useradd --uid 2657 --no-create-home a777-relocation-fixture
          RELOCATION_FIXTURE=$(mktemp -d /var/tmp/a777-relocation.XXXXXXXX)
          sudo cp -a tools app "$RELOCATION_FIXTURE/"
          sudo chown -R 2657:2657 "$RELOCATION_FIXTURE"
          sudo -u '#2657' env TMPDIR="$RELOCATION_FIXTURE" php "$RELOCATION_FIXTURE/tools/tests/CpanelPrivateRuntimeRelocation_test.php"
      - name: Verify real locked production artifact without hosting credentials
        if: ${{ inputs.mode != 'native-status' && inputs.mode != 'native-recover' }}
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python -c 'import os,sys; from pathlib import Path; sys.path.insert(0,"tools"); from cpanel_native_stage import build,archive_release; root=Path(os.environ["RUNNER_TEMP"])/"a777-production-ci"; release,report=build(Path.cwd(),root,os.environ["EXPECTED_COMMIT"]); archive_release(release,root/"verified.zip",os.environ["EXPECTED_COMMIT"]); print(report)'
      - name: Execute explicitly selected mode (native-deploy requires production authorization)
        env:
          MODE: ${{ inputs.mode }}
          RETRY_SAFE_NATIVE_DEPLOY: ${{ inputs.retry_safe_native_deploy }}
          ALLOW_EXISTING_PUBLIC_SOURCE_FOR_REHEARSAL: ${{ inputs.allow_existing_public_source_for_rehearsal }}
          RETRY_INITIAL_REHEARSAL: ${{ inputs.retry_initial_rehearsal }}
          SECURE_RUNTIME_CONFIG_PERMISSIONS: ${{ inputs.secure_runtime_config_permissions }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RUNTIME_CONFIG_SHA256: ${{ inputs.expected_runtime_config_sha256 }}
          EXPECTED_KEY_FINGERPRINT: ${{ inputs.expected_key_fingerprint }}
          A777_CPANEL_HOST: cp73.domains.co.za
          A777_CPANEL_PORT: '2083'
          A777_CPANEL_USER: archite4
          A777_CPANEL_ACCOUNT_HOME: /home/archite4
          A777_CPANEL_API_TOKEN: ${{ secrets.A777_CPANEL_API_TOKEN }}
        run: |
          umask 077
          args=("$MODE" --report "$RUNNER_TEMP/cpanel-git-inspection.json")
          if [[ -n "$EXPECTED_KEY_FINGERPRINT" ]]; then args+=(--expected-key-fingerprint "$EXPECTED_KEY_FINGERPRINT"); fi
          if [[ "$MODE" == prepare-key ]]; then args+=(--public-key "$RUNNER_TEMP/a777-deploy-key.pub"); fi
          if [[ "$MODE" == native-preflight || "$MODE" == restore-rehearsal || "$MODE" == native-deploy ]]; then
            [[ "${GITHUB_REF}" == refs/heads/master ]] || exit 1
            args+=(--expected-commit "$EXPECTED_COMMIT")
            if [[ -n "$EXPECTED_RUNTIME_CONFIG_SHA256" ]]; then args+=(--expected-runtime-config-sha256 "$EXPECTED_RUNTIME_CONFIG_SHA256"); fi
            if [[ "$SECURE_RUNTIME_CONFIG_PERMISSIONS" == true ]]; then args+=(--secure-runtime-config-permissions); fi
            if [[ "$RETRY_INITIAL_REHEARSAL" == true ]]; then
              [[ "$MODE" == restore-rehearsal ]] || exit 1
              args+=(--retry-initial-rehearsal)
            fi
          fi
          if [[ "$ALLOW_EXISTING_PUBLIC_SOURCE_FOR_REHEARSAL" == true ]]; then
            [[ "$MODE" == restore-rehearsal && "$EXPECTED_RUNTIME_CONFIG_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            args+=(--allow-existing-public-source-for-rehearsal)
          fi
          if [[ "$RETRY_SAFE_NATIVE_DEPLOY" == true ]]; then
            [[ "$MODE" == native-deploy ]] || exit 1
            args+=(--retry-safe-native-deploy)
          fi
          if [[ "$MODE" == native-recover ]]; then
            [[ "${GITHUB_REF}" == refs/heads/master ]] || exit 1
            [[ "$SECURE_RUNTIME_CONFIG_PERMISSIONS" != true && "$RETRY_INITIAL_REHEARSAL" != true && "$ALLOW_EXISTING_PUBLIC_SOURCE_FOR_REHEARSAL" != true && "$RETRY_SAFE_NATIVE_DEPLOY" != true && -z "$EXPECTED_RUNTIME_CONFIG_SHA256" ]] || exit 1
            args+=(--expected-commit "$EXPECTED_COMMIT")
          fi
          python tools/cpanel_git.py "${args[@]}"
      - name: Retain safe capability and repository report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-git-inspection
          path: ${{ runner.temp }}/cpanel-git-inspection.json
          if-no-files-found: warn
          retention-days: 7
      - name: Public deploy key only
        if: ${{ inputs.mode == 'prepare-key' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: a777-github-read-only-deploy-key
          path: ${{ runner.temp }}/a777-deploy-key.pub
          if-no-files-found: warn
          retention-days: 1
