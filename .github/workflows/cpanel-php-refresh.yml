name: cPanel account PHP refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reapply ONLY php.architex.co.za actual PHP 8.3 version; no maintenance, DDL or file changes
        type: choice
        required: true
        default: account-php-refresh
        options:
          - account-php-refresh

permissions:
  contents: read

concurrency:
  group: a777-cpanel-git
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic refresh contracts without hosting credentials
        run: python -m unittest discover -s tools/tests -p 'test_cpanel_php_refresh.py' -v
      - name: Explicit single-vhost same-version refresh and public verification
        env:
          MODE: ${{ inputs.mode }}
          A777_CPANEL_HOST: cp73.domains.co.za
          A777_CPANEL_PORT: '2083'
          A777_CPANEL_USER: archite4
          A777_CPANEL_ACCOUNT_HOME: /home/archite4
          A777_CPANEL_API_TOKEN: ${{ secrets.A777_CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REF" == refs/heads/master && "$MODE" == account-php-refresh ]] || exit 1
          python tools/cpanel_php_refresh.py "$MODE" --report "$RUNNER_TEMP/cpanel-php-refresh.json"
      - name: Retain safe status-only report (no provider messages or headers)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-php-refresh
          path: ${{ runner.temp }}/cpanel-php-refresh.json
          if-no-files-found: warn
          retention-days: 7
